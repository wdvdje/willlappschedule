<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <defs>
    <radialGradient id="bgGradient" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </radialGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>
  
  <!-- Calendar card with rounded corners -->
  <g filter="url(#shadow)">
    <!-- Main calendar body -->
    <rect x="96" y="120" width="320" height="300" rx="32" fill="white" opacity="0.95"/>
    
    <!-- Calendar header (month/year area) -->
    <rect x="96" y="120" width="320" height="70" rx="32" fill="#f3f4f6"/>
    
    <!-- Calendar grid lines -->
    <line x1="120" y1="210" x2="392" y2="210" stroke="#e5e7eb" stroke-width="2"/>
    <line x1="120" y1="260" x2="392" y2="260" stroke="#e5e7eb" stroke-width="2"/>
    <line x1="120" y1="310" x2="392" y2="310" stroke="#e5e7eb" stroke-width="2"/>
    <line x1="120" y1="360" x2="392" y2="360" stroke="#e5e7eb" stroke-width="2"/>
    
    <!-- Vertical grid lines -->
    <line x1="163" y1="210" x2="163" y2="390" stroke="#e5e7eb" stroke-width="2"/>
    <line x1="206" y1="210" x2="206" y2="390" stroke="#e5e7eb" stroke-width="2"/>
    <line x1="249" y1="210" x2="249" y2="390" stroke="#e5e7eb" stroke-width="2"/>
    <line x1="292" y1="210" x2="292" y2="390" stroke="#e5e7eb" stroke-width="2"/>
    <line x1="335" y1="210" x2="335" y2="390" stroke="#e5e7eb" stroke-width="2"/>
    <line x1="378" y1="210" x2="378" y2="390" stroke="#e5e7eb" stroke-width="2"/>
    
    <!-- Highlighted date (today) -->
    <circle cx="292" cy="285" r="24" fill="#6366f1" opacity="0.1"/>
    <circle cx="292" cy="285" r="24" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.3"/>
    
    <!-- Day numbers (subtle) -->
    <text x="140" y="245" font-size="18" font-weight="600" fill="#d1d5db" text-anchor="middle">1</text>
    <text x="183" y="245" font-size="18" font-weight="600" fill="#d1d5db" text-anchor="middle">2</text>
    <text x="226" y="245" font-size="18" font-weight="600" fill="#d1d5db" text-anchor="middle">3</text>
    <text x="269" y="245" font-size="18" font-weight="600" fill="#d1d5db" text-anchor="middle">4</text>
    <text x="312" y="245" font-size="18" font-weight="600" fill="#6366f1" text-anchor="middle">5</text>
    <text x="355" y="245" font-size="18" font-weight="600" fill="#d1d5db" text-anchor="middle">6</text>
  </g>
  
  <!-- Clock hand accent (top right, subtle) -->
  <g transform="translate(380, 160)" opacity="0.7">
    <!-- Clock circle -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#fff" stroke-width="2.5"/>
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="8" y2="-8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
